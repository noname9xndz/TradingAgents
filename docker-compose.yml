services:
  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  # The web UI at http://127.0.0.1:3210: docker compose up web
  # Its run history (web_history/ folders and history.db) lives in the same data
  # volume as everything else, so it outlives the container.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:3210:3210"
    environment:
      # Scheduled jobs run in this time zone.
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    # The scheduler only runs while the server does.
    restart: unless-stopped
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    profiles:
      - web

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
